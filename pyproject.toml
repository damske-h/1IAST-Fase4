[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-rag"
version = "0.1.0"
description = "Voice of Customer Intelligence com RAG sobre as reviews da Olist (Tech Challenge Fase 4)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "kagglehub>=0.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
    "langchain-core>=1.6",
    "langchain-google-genai>=4.4",
    "langchain-openai>=1.6",
    "langgraph>=1.2",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
